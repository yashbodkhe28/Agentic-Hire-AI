# ============================================
# Production profile - shared across all services
# ============================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000

logging:
  level:
    root: WARN
    com.agenthire: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

management:
  tracing:
    sampling:
      probability: 0.1
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

server:
  error:
    include-stacktrace: never
    include-message: never
