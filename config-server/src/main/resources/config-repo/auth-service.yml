spring:
  datasource:
    url: jdbc:mysql://localhost:3306/agenthire_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: agenthire
    password: agenthire123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  redis:
    host: localhost
    port: 6379
    password: redis123
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 10
        min-idle: 2

jwt:
  secret: ${JWT_SECRET:agenthire-super-secret-jwt-key-2024-must-be-at-least-256-bits-long}
  expiration-ms: 900000
  refresh-expiration-ms: 604800000

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: email,profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

server:
  port: 8081
