server:
  port: 8086

spring:
  application:
    name: agent-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/agenthire_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:agenthire}
    password: ${MYSQL_PASSWORD:agenthire123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

ai:
  openai:
    api-key: ${OPENAI_API_KEY:your-openai-api-key}
    model: ${OPENAI_MODEL:gpt-4}
    api-url: https://api.openai.com/v1/chat/completions
  gemini:
    api-key: ${GEMINI_API_KEY:your-gemini-api-key}
    model: ${GEMINI_MODEL:gemini-pro}
    api-url: https://generativelanguage.googleapis.com/v1beta/models

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@${EUREKA_HOST:eureka-server}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:zipkin}:9411/api/v2/spans

logging:
  level:
    com.agenthire.agent: DEBUG

